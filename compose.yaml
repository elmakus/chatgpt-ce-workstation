name: chatgpt-ce-workstation

services:
  workstation:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UBUNTU_BASE: ${UBUNTU_BASE:?frozen UBUNTU_BASE is required}
        UBUNTU_APT_IDENTITY: ${UBUNTU_APT_IDENTITY:?frozen UBUNTU_APT_IDENTITY is required}
        UBUNTU_APT_INDEXES: ${UBUNTU_APT_INDEXES:?frozen UBUNTU_APT_INDEXES is required}
        CE_REPOSITORY: ${CE_REPOSITORY:?frozen CE_REPOSITORY is required}
        CE_REF: ${CE_REF:?frozen CE_REF is required}
        CE_COMMIT: ${CE_COMMIT:?frozen CE_COMMIT is required}
        OPENAI_PACKAGE_VERSION: ${OPENAI_PACKAGE_VERSION:?frozen OpenAI package version is required}
        OPENAI_PACKAGE_SHA256: ${OPENAI_PACKAGE_SHA256:?frozen OpenAI package SHA-256 is required}
        S6_OVERLAY_VERSION: ${S6_OVERLAY_VERSION:?frozen s6-overlay version is required}
        S6_OVERLAY_NOARCH_SHA256: ${S6_OVERLAY_NOARCH_SHA256:?frozen s6 noarch SHA-256 is required}
        S6_OVERLAY_X86_64_SHA256: ${S6_OVERLAY_X86_64_SHA256:?frozen s6 x86_64 SHA-256 is required}
        AGENT_WORKSPACE_VERSION: ${AGENT_WORKSPACE_VERSION:?frozen Agent Workspace version is required}
        AGENT_WORKSPACE_INTEGRITY: ${AGENT_WORKSPACE_INTEGRITY:?frozen Agent Workspace integrity is required}
        CODEX_CHATGPT_WEB_VERSION: ${CODEX_CHATGPT_WEB_VERSION:?frozen codex-chatgpt-web version is required}
        CODEX_CHATGPT_WEB_SHA256: ${CODEX_CHATGPT_WEB_SHA256:?frozen codex-chatgpt-web SHA-256 is required}
        CODEX_CHATGPT_WEB_UPSTREAM_VERSION: ${CODEX_CHATGPT_WEB_UPSTREAM_VERSION:?frozen upstream codex-chatgpt-web version is required}
        CODEX_CHATGPT_WEB_UPSTREAM_SHA256: ${CODEX_CHATGPT_WEB_UPSTREAM_SHA256:?frozen upstream codex-chatgpt-web SHA-256 is required}
        OPENCODEX_VERSION: ${OPENCODEX_VERSION:?frozen OpenCodex version is required}
        OPENCODEX_INTEGRITY: ${OPENCODEX_INTEGRITY:?frozen OpenCodex integrity is required}
        OPENCODEX_SHASUM: ${OPENCODEX_SHASUM:?frozen OpenCodex shasum is required}
        MUSE_INSTALLER_URL: ${MUSE_INSTALLER_URL:?frozen Muse installer URL is required}
        MUSE_INSTALLER_SHA256: ${MUSE_INSTALLER_SHA256:?frozen Muse installer SHA-256 is required}
        MUSE_EXPECTED_VERSION: ${MUSE_EXPECTED_VERSION:?frozen Muse release id is required}
        CHROME_VERSION: ${CHROME_VERSION:?frozen Chrome version is required}
        CHROME_PACKAGE_SHA256: ${CHROME_PACKAGE_SHA256:?frozen Chrome package SHA-256 is required}
        GOOGLE_LINUX_PUB_MATERIAL_SHA256: ${GOOGLE_LINUX_PUB_MATERIAL_SHA256:?frozen Google signing-key SHA-256 is required}
        RUST_VERSION: ${RUST_VERSION:?frozen Rust version is required}
        RUST_STABLE_MANIFEST_SHA256: ${RUST_STABLE_MANIFEST_SHA256:?frozen Rust stable manifest SHA-256 is required}
        RUSTUP_INSTALLER_SHA256: ${RUSTUP_INSTALLER_SHA256:?frozen rustup installer SHA-256 is required}
        UPSTREAM_RESOLUTION_SHA256: ${UPSTREAM_RESOLUTION_SHA256:?frozen resolution SHA-256 is required}
        CODEX_UID: ${CODEX_UID:-99}
        CODEX_GID: ${CODEX_GID:-100}
    image: ${IMAGE_NAME:-chatgpt-ce-workstation}:${IMAGE_TAG:-local}
    container_name: ${CONTAINER_NAME:-chatgpt-ce-workstation}
    hostname: chatgpt-ce-workstation
    restart: unless-stopped
    shm_size: ${SHM_SIZE:-1gb}
    working_dir: /home/codex/Documents/ChatGPT
    environment:
      TZ: ${TZ_VALUE:-Europe/Zurich}
      CODEX_CHATGPT_WEB_NATIVE_UPSTREAM: ${CODEX_CHATGPT_WEB_NATIVE_UPSTREAM:-}
      INSTALL_GLOBAL_AGENTS: ${INSTALL_GLOBAL_AGENTS:-1}
    ports:
      - "${NOVNC_BIND_IP:-0.0.0.0}:${NOVNC_PORT:-6080}:6080"
    volumes:
      - type: bind
        source: ${APPDATA_ROOT:-/mnt/user/appdata/chatgpt-ce-workstation}/home
        target: /home/codex
      - type: bind
        source: ${PROJECTS_ROOT:-/mnt/user/projects}
        target: /home/codex/Documents/ChatGPT
    secrets:
      - source: keyring_password
        target: keyring-password
        mode: 0400
    healthcheck:
      test: ["CMD", "bash", "/usr/local/bin/workstation-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s

secrets:
  keyring_password:
    file: ${APPDATA_ROOT:-/mnt/user/appdata/chatgpt-ce-workstation}/secrets/keyring-password
