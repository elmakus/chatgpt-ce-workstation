name: Exact candidate build

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "compose.yaml"
      - ".dockerignore"
      - "scripts/build.sh"
      - "scripts/resolve-upstreams.py"
      - "scripts/render-build-env.py"
      - "scripts/build/**"
      - "scripts/test-resolve-upstreams.py"
      - "scripts/test-render-build-env.py"
      - ".github/workflows/candidate-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exact-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-candidate:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IMAGE_NAME: chatgpt-ce-workstation-ci
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          docker system prune -af || true
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Resolve one frozen upstream set
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/resolve-upstreams.py --output upstream-resolution.json
          python3 -m json.tool upstream-resolution.json >/dev/null
          resolution_sha="$(sha256sum upstream-resolution.json | awk '{print $1}')"
          echo "RESOLUTION_SHA256=$resolution_sha" >> "$GITHUB_ENV"
          echo "CANDIDATE_TAG=candidate-${resolution_sha:0:16}" >> "$GITHUB_ENV"
          echo "Resolved exact candidate input: sha256:$resolution_sha"

      - name: Build exact non-production candidate
        env:
          UPSTREAM_RESOLUTION_FILE: ${{ github.workspace }}/upstream-resolution.json
        run: bash scripts/build.sh

      - name: Read back exact candidate provenance
        run: |
          image_ref="$IMAGE_NAME:$CANDIDATE_TAG"
          image_id="$(docker image inspect "$image_ref" --format '{{.Id}}')"
          label="$(docker image inspect "$image_ref" --format '{{ index .Config.Labels "io.chatgpt-ce-workstation.upstream-resolution-sha256" }}')"
          test "$label" = "$RESOLUTION_SHA256"

          cid="$(docker create "$image_ref")"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/opt/workstation/upstream-resolution.json" embedded-resolution.json
          cmp upstream-resolution.json embedded-resolution.json
          embedded_sha="$(sha256sum embedded-resolution.json | awk '{print $1}')"
          test "$embedded_sha" = "$RESOLUTION_SHA256"

          echo "CANDIDATE_EVIDENCE image_ref=$image_ref"
          echo "CANDIDATE_EVIDENCE image_id=$image_id"
          echo "CANDIDATE_EVIDENCE resolution_sha256=$RESOLUTION_SHA256"
          echo "CANDIDATE_EVIDENCE label_sha256=$label"
          echo "CANDIDATE_EVIDENCE embedded_sha256=$embedded_sha"
          df -h /
